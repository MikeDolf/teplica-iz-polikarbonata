<div class="callbar">
  {%- if site.phone_display %}
  <a class="callbar__phone" href="tel:{{ site.phone_tel }}" aria-label="Позвонить">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1z"/></svg>
    Позвонить
  </a>
  {%- endif %}
  <a class="callbar__form" href="#zayavka">Оставить заявку</a>
  <a class="callbar__mail" href="mailto:{{ site.contact_email }}" aria-label="Написать на почту">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm8 7L5 7v1l7 5 7-5V7l-7 5z"/></svg>
    Почта
  </a>
</div>
