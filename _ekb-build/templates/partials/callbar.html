<div class="callbar">
  {%- if site.max_url %}
  <a class="callbar__phone" href="{{ site.max_url }}" target="_blank" rel="nofollow noopener" aria-label="Написать в MAX">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
    {#- на экранах уже 360px три кнопки не помещаются в строку, поэтому
        подписи сокращаются: смысл кнопки держат иконка и aria-label -#}
    <span class="callbar__long">Написать в MAX</span><span class="callbar__short">MAX</span>
  </a>
  {%- endif %}
  <a class="callbar__form" href="#zayavka"><span class="callbar__long">Оставить заявку</span><span class="callbar__short">Заявка</span></a>
  <a class="callbar__mail" href="mailto:{{ site.contact_email }}" aria-label="Написать на почту">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm8 7L5 7v1l7 5 7-5V7l-7 5z"/></svg>
    <span>Почта</span>
  </a>
</div>
