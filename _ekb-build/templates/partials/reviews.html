{%- if reviews %}
<section class="band band--tint" aria-labelledby="rev-title">
  <div class="wrap">
    <h2 id="rev-title" class="sec-h">Отзывы клиентов</h2>
    <div class="reviews__grid">
      {%- for r in reviews %}
      <div class="review">
        <div class="review__head">
          <span class="review__name">{{ r.name }}</span>
          <span class="review__meta">{{ r.area }}{% if r.date %}, {{ r.date }}{% endif %}</span>
        </div>
        {%- if r.stars %}<div class="review__stars">{{ "★" * r.stars }}{{ "☆" * (5 - r.stars) }}</div>{%- endif %}
        <p class="review__text">{{ r.text }}</p>
      </div>
      {%- endfor %}
    </div>
  </div>
</section>
{%- endif %}
