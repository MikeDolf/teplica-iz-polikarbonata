<header class="hdr">
  <div class="wrap hdr__in">
    <a class="hdr__logo" href="/dostavka-grunta/">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 3c-4 4-6 7-6 10a6 6 0 0 0 12 0c0-3-2-6-6-10z"/></svg>
      <span>{{ site.brand }}</span>
    </a>
    {%- if site.max_url %}
    <a class="hdr__phone hdr__max" href="{{ site.max_url }}" target="_blank" rel="nofollow noopener">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
      <span>Написать в MAX</span>
    </a>
    {%- endif %}
    <a class="hdr__mail" href="mailto:{{ site.contact_email }}" aria-label="Написать на почту">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm8 7L5 7v1l7 5 7-5V7l-7 5z"/></svg>
      <span class="hdr__mail-txt">{{ site.contact_email }}</span>
    </a>
    <a class="hdr__cta" href="#zayavka">Оставить заявку</a>
  </div>
</header>
