<svg class="heroscene" viewBox="0 0 1200 420" preserveAspectRatio="xMaxYMid slice" aria-hidden="true" focusable="false">
  <defs>
    <!-- В SVG-маске видимость задаёт яркость: белое видно, чёрное скрыто.
         Градиент гасит сцену слева, чтобы она не спорила с заголовком. -->

      <stop offset="0"   stop-color="#fff" stop-opacity="0"/>
      <stop offset=".52" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".78" stop-color="#fff" stop-opacity=".7"/>
      <stop offset="1"   stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="hsMask"><rect width="1200" height="420" fill="url(#hsFade)"/></mask>
  </defs>

  <g mask="url(#hsMask)">

    <path d="M600 284 L720 248 L830 278 L940 242 L1060 272 L1200 254 L1200 386 L600 386 Z"

      <path d="M952 240 l8 20 h-16 z"/>

    <!-- земля -->
    <path d="M600 310 L1200 296 L1200 386 L600 386 Z" fill="#8fcaa1" opacity=".16"/>

    <!-- кучи материала -->
    <path d="M620 310 L676 266 L732 310 Z" fill="#8fcaa1" opacity=".20"/>
    <path d="M1088 306 L1136 268 L1184 306 Z" fill="#8fcaa1" opacity=".18"/>

    <!-- самосвал с поднятым кузовом -->

          fill="#c3e6ce" opacity=".22"/>
