<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12331f">
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}">
  <meta name="robots" content="{{ robots }}">
  <link rel="canonical" href="{{ canonical }}">
  <meta property="og:type" content="{{ og_type|default('website') }}">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:site_name" content="{{ site.brand }}">
  <meta property="og:title" content="{{ title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:image" content="{{ site.domain }}/img/og-cover.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ site.domain }}/img/og-cover.jpg">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ site.css }}">
{%- if site.metrika_id %}
  <script type="text/javascript">
    window.__ymid = {{ site.metrika_id }};
    (function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
    m[i].l=1*new Date();for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}
    k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
    (window,document,'script','https://mc.yandex.ru/metrika/tag.js?id={{ site.metrika_id }}','ym');
    ym({{ site.metrika_id }},'init',{ssr:true,webvisor:true,clickmap:true,accurateTrackBounce:true,trackLinks:true});
  </script>
  <noscript><div><img src="https://mc.yandex.ru/watch/{{ site.metrika_id }}" style="position:absolute;left:-9999px;" alt="" /></div></noscript>
{%- endif %}
{%- block schema %}{% endblock %}
</head>
<body class="ekb">

{% include "partials/header.html" %}

{%- block breadcrumbs %}{% endblock %}

<main id="top">
{%- block content %}{% endblock %}
</main>

{% include "partials/footer.html" %}
{% include "partials/callbar.html" %}

  {% include "partials/floatcta.html" %}
  <script>
  // Всплывающий блок связи: появляется, когда шапка ушла из виду,
  // и прячется у формы заявки, чтобы не перекрывать её собой.
  (function(){
    var el=document.getElementById('fcta'); if(!el) return;
    if (localStorage.getItem('fctaHidden')==='1') return;
    var hero=document.querySelector('.hero'), form=document.getElementById('zayavka');
    el.hidden=false;
    var shown=false;
    function upd(){
      var past = hero ? (hero.getBoundingClientRect().bottom < 0) : (window.scrollY > 700);
      var atForm = form && form.getBoundingClientRect().top < window.innerHeight*0.9
                        && form.getBoundingClientRect().bottom > 0;
      var want = past && !atForm;
      if (want!==shown){ shown=want; el.classList.toggle('is-on', want); }
    }
    var tick=false;
    addEventListener('scroll', function(){ if(!tick){ tick=true; requestAnimationFrame(function(){ upd(); tick=false; }); } }, {passive:true});
    addEventListener('resize', upd, {passive:true});
    el.querySelector('.fcta__close').addEventListener('click', function(){
      el.classList.remove('is-on'); localStorage.setItem('fctaHidden','1');
    });
    upd();
  })();
  </script>
</body>
</html>
